<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fall Line — a first-person skiing game</title>
<meta name="description" content="Twenty-seven procedurally generated mountains. No clock, no gates, no finish line. Just skiing." />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="styles/main.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛷️</text></svg>" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
  <canvas id="viewport"></canvas>

  <div id="hud" class="hud"></div>
  <div id="menu" class="menu"></div>

  <div id="boot" class="boot">
    <div class="boot-inner">
      <div class="boot-mark">⛰</div>
      <div class="boot-text">Fall Line</div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>

  <div id="boot-error" class="boot-error">
    <div class="boot-error-inner">
      <h1>Fall Line</h1>
      <p class="boot-msg"></p>
      <pre class="boot-detail"></pre>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
